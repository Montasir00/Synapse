<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded Concentric Border -->
  <circle cx="50" cy="50" r="46" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="6"/>
  <!-- Neural Synapse Pathway Nodes -->
  <circle cx="50" cy="35" r="7.5" fill="#8b5cf6"/>
  <circle cx="33" cy="62" r="7.5" fill="#8b5cf6"/>
  <circle cx="67" cy="62" r="7.5" fill="#8b5cf6"/>
  <!-- Connecting Synaptic Bridges -->
  <line x1="50" y1="35" x2="33" y2="62" stroke="#8b5cf6" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="35" x2="67" y2="62" stroke="#8b5cf6" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="33" y1="62" x2="67" y2="62" stroke="#8b5cf6" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="3.5 3.5"/>
</svg>
